    // =========================================================================
    // MODULE 2: INTERACTIVE TYPING TEST SIMULATOR
    // =========================================================================
    function ModuleTyping() {
      const [selectedPassage, setSelectedPassage] = useState(TYPING_PASSAGES[0]);
      const [duration, setDuration] = useState(60); // seconds
      const [timeLeft, setTimeLeft] = useState(60);
      const [isActive, setIsActive] = useState(false);
      const [userInput, setUserInput] = useState("");
      const [wpm, setWpm] = useState(0);
      const [accuracy, setAccuracy] = useState(100);
      const [isFinished, setIsFinished] = useState(false);
      const inputRef = useRef(null);

      // Reset Test
      const resetTest = (newDuration = duration, passage = selectedPassage) => {
        setIsActive(false);
        setTimeLeft(newDuration);
        setUserInput("");
        setWpm(0);
        setAccuracy(100);
        setIsFinished(false);
      };

      // Handle Timer
      useEffect(() => {
        let timer = null;
        if (isActive && timeLeft > 0) {
          timer = setInterval(() => {
            setTimeLeft((prev) => prev - 1);
          }, 1000);
        } else if (timeLeft === 0 && isActive) {
          setIsActive(false);
          setIsFinished(true);
        }
        return () => clearInterval(timer);
      }, [isActive, timeLeft]);

      // Calculate WPM and Accuracy
      const handleInputChange = (e) => {
        const value = e.target.value;
        if (!isActive && !isFinished) {
          setIsActive(true);
        }

        setUserInput(value);

        const targetText = selectedPassage.text;
        let correctChars = 0;

        for (let i = 0; i < value.length; i++) {
          if (value[i] === targetText[i]) {
            correctChars++;
          }
        }

        // Standard WPM = (All Typed Characters / 5) / Time Elapsed in minutes
        const timeElapsed = (duration - timeLeft) || 1;
        const grossWpm = Math.round((value.length / 5) / (timeElapsed / 60));
        const calcAcc = value.length > 0 ? Math.round((correctChars / value.length) * 100) : 100;

        setWpm(grossWpm < 0 || isNaN(grossWpm) ? 0 : grossWpm);
        setAccuracy(calcAcc);

        // Auto finish if completed passage
        if (value.length >= targetText.length) {
          setIsActive(false);
          setIsFinished(true);
        }
      };

      return (
        <div className="space-y-6">
          
          {/* Header Controls */}
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
              <h2 className="text-xl font-bold text-white flex items-center gap-2">
                <i className="fa-solid fa-keyboard text-tp-500"></i>
                <span>BPO Chat Typing Simulator</span>
              </h2>
              <p className="text-xs text-slate-400 mt-1">
                Teleperformance AOE Non-Voice standard target: <strong className="text-purple-300">35 - 45+ WPM</strong> with <strong className="text-purple-300">&gt;95% Accuracy</strong>.
              </p>
            </div>

            <div className="flex items-center gap-3 w-full md:w-auto">
              
              {/* Duration selector */}
              <select 
                value={duration} 
                onChange={(e) => {
                  const d = parseInt(e.target.value);
                  setDuration(d);
                  resetTest(d);
                }}
                className="bg-slate-800 border border-slate-700 text-xs font-semibold rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-tp-500"
              >
                <option value={60}>1 Minute Test (Standard)</option>
                <option value={120}>2 Minute Test (Extended)</option>
              </select>

              {/* Passage selector */}
              <select 
                value={selectedPassage.id}
                onChange={(e) => {
                  const p = TYPING_PASSAGES.find(item => item.id === parseInt(e.target.value));
                  setSelectedPassage(p);
                  resetTest(duration, p);
                }}
                className="bg-slate-800 border border-slate-700 text-xs font-semibold rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-tp-500"
              >
                {TYPING_PASSAGES.map(p => (
                  <option key={p.id} value={p.id}>{p.title}</option>
                ))}
              </select>

              <button 
                onClick={() => resetTest()}
                className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-semibold text-xs px-3 py-2 rounded-xl transition-all"
              >
                <i className="fa-solid fa-rotate-right mr-1"></i> Reset
              </button>
            </div>
          </div>

          {/* Live Metrics Cards */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl text-center">
              <div className="text-xs text-slate-400">Time Left</div>
              <div className={`text-2xl font-black mt-1 ${timeLeft <= 10 ? 'text-rose-400 animate-pulse' : 'text-white'}`}>
                {timeLeft}s
              </div>
            </div>

            <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl text-center">
              <div className="text-xs text-slate-400">Current Speed</div>
              <div className="text-2xl font-black text-tp-500 mt-1">{wpm} <span className="text-xs font-normal text-slate-400">WPM</span></div>
            </div>

            <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl text-center">
              <div className="text-xs text-slate-400">Accuracy</div>
              <div className={`text-2xl font-black mt-1 ${accuracy >= 95 ? 'text-green-400' : accuracy >= 90 ? 'text-amber-400' : 'text-rose-400'}`}>
                {accuracy}%
              </div>
            </div>

            <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl text-center">
              <div className="text-xs text-slate-400">TP Benchmark Status</div>
              <div className="text-xs font-bold mt-2">
                {wpm >= 40 && accuracy >= 95 ? (
                  <span className="text-green-400 bg-green-950/60 border border-green-800 px-2 py-1 rounded">PASSED (AOE Ready)</span>
                ) : wpm >= 30 ? (
                  <span className="text-amber-400 bg-amber-950/60 border border-amber-800 px-2 py-1 rounded">NEAR TARGET</span>
                ) : (
                  <span className="text-slate-400 bg-slate-800 px-2 py-1 rounded">NEEDS PRACTICE</span>
                )}
              </div>
            </div>
          </div>

          {/* Typing Area */}
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 relative">
            
            {/* Passage Text Box */}
            <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 font-mono text-sm leading-relaxed tracking-wide select-none mb-4 max-h-48 overflow-y-auto">
              {selectedPassage.text.split("").map((char, index) => {
                let charClass = "text-slate-500";
                if (index < userInput.length) {
                  charClass = userInput[index] === char ? "text-green-400 bg-green-950/40" : "text-rose-400 bg-rose-950/60 underline";
                } else if (index === userInput.length) {
                  charClass = "text-white bg-tp-600 animate-pulse";
                }
                return <span key={index} className={`${charClass} rounded-xs transition-colors`}>{char}</span>;
              })}
            </div>

            {/* User Input Area */}
            <textarea
              ref={inputRef}
              value={userInput}
              onChange={handleInputChange}
              disabled={isFinished || timeLeft === 0}
              placeholder="Start typing the passage above..."
              className="w-full bg-slate-950 border border-purple-900/50 rounded-xl p-4 font-mono text-sm text-slate-100 focus:outline-none focus:border-tp-500 resize-none h-32 disabled:opacity-50"
            />

            {/* Test Completed Modal Banner */}
            {isFinished && (
              <div className="mt-4 bg-gradient-to-r from-purple-950 to-indigo-950 border border-tp-500/50 rounded-xl p-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div>
                  <h4 className="font-bold text-white text-sm">Test Completed!</h4>
                  <p className="text-xs text-slate-300 mt-0.5">
                    Your Speed: <strong className="text-purple-300">{wpm} WPM</strong> | Accuracy: <strong className="text-purple-300">{accuracy}%</strong>
                  </p>
                </div>
                <button 
                  onClick={() => resetTest()}
                  className="bg-tp-600 hover:bg-tp-500 text-white font-semibold text-xs px-4 py-2 rounded-xl transition-all shadow-lg shadow-tp-600/30"
                >
                  Try Again
                </button>
              </div>
            )}

          </div>

        </div>
      );
    }

    // =========================================================================
    // MODULE 3: GRAMMAR & WRITTEN COMMUNICATION QUIZ
    // =========================================================================
    function ModuleGrammar() {
      const [currentIdx, setCurrentIdx] = useState(0);
      const [selectedOptions, setSelectedOptions] = useState({});
      const [showExplanation, setShowExplanation] = useState({});
      const [score, setScore] = useState(0);

      const handleSelectOption = (qId, optionIdx) => {
        if (selectedOptions[qId] !== undefined) return; // prevent re-selection
        
        const isCorrect = optionIdx === GRAMMAR_QUESTIONS[currentIdx].correct;
        setSelectedOptions(prev => ({ ...prev, [qId]: optionIdx }));
        setShowExplanation(prev => ({ ...prev, [qId]: true }));

        if (isCorrect) {
          setScore(prev => prev + 1);
        }
      };

      const q = GRAMMAR_QUESTIONS[currentIdx];
      const isAnswered = selectedOptions[q.id] !== undefined;

      return (
        <div className="space-y-6">
          
          {/* Header */}
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
              <h2 className="text-xl font-bold text-white flex items-center gap-2">
                <i className="fa-solid fa-pen-clip text-tp-accent"></i>
                <span>Grammar & Customer Etiquette Assessment</span>
              </h2>
              <p className="text-xs text-slate-400 mt-1">
                Simulates Harver / Berlitz / Versant non-voice written screening questions.
              </p>
            </div>

            <div className="flex items-center gap-4">
              <div className="text-right">
                <div className="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Score</div>
                <div className="text-lg font-black text-purple-300">{score} / {GRAMMAR_QUESTIONS.length}</div>
              </div>
            </div>
          </div>

          {/* Question Card */}
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
            
            {/* Question Progress bar */}
            <div className="flex justify-between items-center text-xs text-slate-400 mb-2">
              <span>Question {currentIdx + 1} of {GRAMMAR_QUESTIONS.length}</span>
              <span>{Math.round(((currentIdx + 1) / GRAMMAR_QUESTIONS.length) * 100)}% Completed</span>
            </div>
            <div className="w-full bg-slate-800 h-1.5 rounded-full mb-6">
              <div 
                className="bg-gradient-to-r from-tp-500 to-tp-accent h-1.5 rounded-full transition-all duration-300"
                style={{ width: `${((currentIdx + 1) / GRAMMAR_QUESTIONS.length) * 100}%` }}
              ></div>
            </div>

            {/* Question Text */}
            <h3 className="text-base font-bold text-white mb-6 leading-relaxed">
              {q.question}
            </h3>

            {/* Options list */}
            <div className="space-y-3">
              {q.options.map((opt, optIdx) => {
                const isSelected = selectedOptions[q.id] === optIdx;
                const isCorrect = optIdx === q.correct;
                let optionStyle = "bg-slate-950 border-slate-800 hover:border-purple-600/60 text-slate-200";

                if (isAnswered) {
                  if (isCorrect) {
                    optionStyle = "bg-green-950/50 border-green-500 text-green-200 font-semibold";
                  } else if (isSelected && !isCorrect) {
                    optionStyle = "bg-rose-950/50 border-rose-500 text-rose-200";
                  } else {
                    optionStyle = "bg-slate-950/40 border-slate-800/40 text-slate-500 opacity-60";
                  }
                }

                return (
                  <button
                    key={optIdx}
                    onClick={() => handleSelectOption(q.id, optIdx)}
                    disabled={isAnswered}
                    className={`w-full text-left p-4 rounded-xl border transition-all text-xs flex items-center justify-between gap-3 ${optionStyle}`}
                  >
                    <div className="flex items-center gap-3">
                      <span className="w-6 h-6 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-xs text-purple-300 shrink-0">
                        {String.fromCharCode(65 + optIdx)}
                      </span>
                      <span>{opt}</span>
                    </div>

                    {isAnswered && isCorrect && (
                      <i className="fa-solid fa-circle-check text-green-400 text-sm shrink-0"></i>
                    )}
                    {isAnswered && isSelected && !isCorrect && (
                      <i className="fa-solid fa-circle-xmark text-rose-400 text-sm shrink-0"></i>
                    )}
                  </button>
                );
              })}
            </div>

            {/* Explanation Card */}
            {isAnswered && (
              <div className="mt-6 bg-purple-950/40 border border-purple-800/40 rounded-xl p-4 text-xs">
                <div className="font-bold text-purple-300 mb-1 flex items-center gap-2">
                  <i className="fa-solid fa-lightbulb text-amber-300"></i>
                  <span>Explanation & Rule:</span>
                </div>
                <p className="text-slate-300 leading-relaxed">{q.explanation}</p>
              </div>
            )}

            {/* Navigation Buttons */}
            <div className="mt-6 flex justify-between items-center pt-4 border-t border-slate-800">
              <button
                onClick={() => setCurrentIdx(prev => Math.max(0, prev - 1))}
                disabled={currentIdx === 0}
                className="bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-slate-200 text-xs font-semibold px-4 py-2 rounded-xl transition-all"
              >
                Previous

              <button
                onClick={() => setCurrentIdx(prev => Math.min(GRAMMAR_QUESTIONS.length - 1, prev + 1))}

              >
                Next Question
              </button>
            </div>

          </div>

        </div>
      );
    }

    // =========================================================================
    // MODULE 4: LIVE CHAT & EMAIL SCENARIO SIMULATOR
    // =========================================================================
    function ModuleChatSim() {
      const [selectedScenario, setSelectedScenario] = useState(CHAT_SCENARIOS[0]);
      const [messages, setMessages] = useState([
        { sender: 'customer', text: CHAT_SCENARIOS[0].initialMessage, time: '10:00 AM' }
      ]);
      const [agentInput, setAgentInput] = useState("");
      const [chatEvaluation, setChatEvaluation] = useState(null);

      // Select scenario
      const handleScenarioChange = (scenario) => {
        setSelectedScenario(scenario);
        setMessages([
          { sender: 'customer', text: scenario.initialMessage, time: '10:00 AM' }
        ]);
        setAgentInput("");
        setChatEvaluation(null);
      };

      // Append Quick Snippet
      const insertSnippet = (text) => {
        setAgentInput(prev => prev ? `${prev} ${text}` : text);
      };

      // Submit Agent Chat Response & Evaluate
      const handleSendMessage = () => {
        if (!agentInput.trim()) return;

        const newMsg = { sender: 'agent', text: agentInput, time: '10:02 AM' };
        const updatedMessages = [...messages, newMsg];
        setMessages(updatedMessages);

        // Run automated BPO Evaluation Engine
        const lowerInput = agentInput.toLowerCase();
        let matchedKeywords = 0;
        const required = selectedScenario.requiredKeywords;

        required.forEach(kw => {
          if (lowerInput.includes(kw)) matchedKeywords++;
        });

        const keywordScore = Math.min(100, Math.round((matchedKeywords / required.length) * 100));
        const hasLength = agentInput.length > 40;
        const hasEmpathy = lowerInput.includes("apologize") || lowerInput.includes("understand") || lowerInput.includes("sorry");
        
        let grade = "B";
        let feedback = [];

        if (hasEmpathy) {
          feedback.push("Great empathy statement detected.");
        } else {
          feedback.push("Missing empathy trigger words (e.g. 'apologize', 'understand').");
        }

        if (agentInput.length < 30) {
          feedback.push("Response is too brief. Provide more comprehensive details.");
        } else {
          feedback.push("Good response length and context.");
        }

        const overallRating = Math.round((keywordScore * 0.6) + (hasEmpathy ? 20 : 0) + (hasLength ? 20 : 0));

        setChatEvaluation({
          score: overallRating,
          feedback: feedback,
          matchedCount: matchedKeywords,
          totalKeywords: required.length
        });

        setAgentInput("");
      };

      return (
        <div className="space-y-6">
          
          {/* Header */}
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col md:flex-row justify-between items-center gap-4">

                <span>Live Interactive Chat Simulator</span>

              <p className="text-xs text-slate-400 mt-1">
                Practice responding to customer complaints under realistic BPO chat evaluation rules.
              </p>
            </div>

            {/* Scenario Picker */}
            <select 
              onChange={(e) => {
                const s = CHAT_SCENARIOS.find(sc => sc.id === e.target.value);
                handleScenarioChange(s);
              }}
              className="bg-slate-800 border border-slate-700 text-xs font-semibold rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-tp-500"
            >
              {CHAT_SCENARIOS.map(s => (
                <option key={s.id} value={s.id}>{s.title} ({s.difficulty})</option>
              ))}
            </select>
          </div>

          {/* Chat Workstation Grid */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            {/* Left Column: Simulated Chat Window (2 cols) */}
            <div className="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl flex flex-col h-[520px]">
              
              {/* Chat Header Bar */}
              <div className="bg-slate-950 px-4 py-3 border-b border-slate-800 rounded-t-2xl flex justify-between items-center">
                <div className="flex items-center gap-3">
                  <span className="text-2xl">{selectedScenario.avatar}</span>
                  <div>
                    <div className="font-bold text-xs text-white flex items-center gap-2">
                      <span>{selectedScenario.customerName}</span>
                      <span className="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                    </div>
                    <div className="text-[10px] text-slate-400">Order Ref: #TP-88421 • Verified Customer</div>
                  </div>
                </div>
                <span className="text-[10px] bg-purple-950 text-purple-300 border border-purple-800 px-2 py-0.5 rounded-full font-semibold">
                  Queue: E-Commerce AOE
                </span>

              {/* Chat Message History */}

                </button>

            </div>

            {/* Right Column: Automated QA Evaluation Feedback Panel */}
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between">
              <div>
                <h3 className="font-bold text-white text-sm mb-3 flex items-center gap-2">
                  <i className="fa-solid fa-award text-amber-400"></i>
                  <span>QA Evaluation Feedback</span>
                </h3>

                {chatEvaluation ? (
                  <div className="space-y-4">
                    
                    {/* Score Gauge */}
                    <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 text-center">
                      <div className="text-xs text-slate-400">Overall QA Score</div>
                      <div className={`text-3xl font-black mt-1 ${chatEvaluation.score >= 80 ? 'text-green-400' : 'text-amber-400'}`}>
                        {chatEvaluation.score}%
                      </div>
                      <div className="text-[10px] text-slate-400 mt-1">
                        Matched {chatEvaluation.matchedCount} of {chatEvaluation.totalKeywords} recommended criteria
                      </div>
                    </div>

                    {/* Feedback Checklist */}
                    <div className="space-y-2">
                      <div className="text-xs font-semibold text-slate-300">Diagnostic Pointers:</div>
                      {chatEvaluation.feedback.map((fb, idx) => (
                        <div key={idx} className="text-xs bg-slate-950/60 p-2.5 rounded-lg border border-slate-800/80 text-slate-300 flex items-start gap-2">
                          <i className="fa-solid fa-circle-info text-tp-500 mt-0.5"></i>
                          <span>{fb}</span>
                        </div>
                      ))}
                    </div>

                  </div>
                ) : (
                  <div className="bg-slate-950/40 border border-dashed border-slate-800 rounded-xl p-6 text-center text-xs text-slate-500">
                    <i className="fa-solid fa-robot text-2xl text-slate-700 mb-2 block"></i>
                    Send a response in the chat window to trigger live QA evaluation feedback.
                  </div>
                )}
              </div>

              {/* Account Checklist Reminders */}
              <div className="mt-4 pt-3 border-t border-slate-800 text-[11px] text-slate-400 space-y-1">
                <div className="font-semibold text-slate-300 mb-1">QA Checklist Checklist:</div>
                <div className="flex items-center gap-1.5"><i className="fa-solid fa-check text-green-400 text-[9px]"></i> Greeting & Customer Name</div>
                <div className="flex items-center gap-1.5"><i className="fa-solid fa-check text-green-400 text-[9px]"></i> Empathy Statement</div>
                <div className="flex items-center gap-1.5"><i className="fa-solid fa-check text-green-400 text-[9px]"></i> Account Security Verification</div>
                <div className="flex items-center gap-1.5"><i className="fa-solid fa-check text-green-400 text-[9px]"></i> Clear Resolution Steps</div>
              </div>

            </div>

          </div>

        </div>
      );
    }

    // =========================================================================
    // MODULE 5: INTERVIEW FLASHCARDS & STAR METHOD BUILDER
    // =========================================================================
    function ModuleInterview() {
      const [cardIndex, setCardIndex] = useState(0);
      const [showAnswer, setShowAnswer] = useState(false);

      // STAR Builder State
      const [starData, setStarData] = useState({
        situation: "",
        task: "",
        action: "",
        result: ""
      });
      const [starOutput, setStarOutput] = useState("");

      const card = INTERVIEW_FLASHCARDS[cardIndex];

      const generateStarResponse = () => {
        if (!starData.situation || !starData.action) return;
        const compiled = `In my previous experience, ${starData.situation}. My core objective was to ${starData.task}. To address this, I ${starData.action}. As a direct result, ${starData.result}.`;
        setStarOutput(compiled);
      };

      const copyToClipboard = (text) => {
        if (!text || !document.body) {
          return;
        }

        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();

        try {
          const copied = document.execCommand('copy');
          if (!copied) {
            throw new Error('Copy command failed');
          }
          alert("Copied to clipboard!");
        } catch (error) {
          console.warn('Clipboard copy failed:', error);
        } finally {
          document.body.removeChild(textarea);
        }
      };

      return (
        <div className="space-y-8">
          
          {/* Section 1: Flashcards */}
          <div>
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
              <div>
                <h2 className="text-xl font-bold text-white flex items-center gap-2">
                  <i className="fa-solid fa-user-tie text-tp-accent"></i>
                  <span>Interview Flashcards & Model Answers</span>
                </h2>
                <p className="text-xs text-slate-400 mt-1">
                  Initial & Operations Interview questions commonly asked in Teleperformance AOE accounts.
                </p>
              </div>
              <span className="text-xs bg-purple-950 text-purple-300 border border-purple-800 px-3 py-1 rounded-full font-semibold">
                Card {cardIndex + 1} of {INTERVIEW_FLASHCARDS.length}
              </span>
            </div>

            {/* Flashcard Component */}
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center min-h-[260px] flex flex-col justify-between relative shadow-xl">
              
              <div className="space-y-4">
                <span className="bg-slate-800 text-purple-300 text-[10px] font-bold px-3 py-1 rounded-full border border-slate-700">
                  {card.category}
                </span>

                <h3 className="text-lg font-bold text-white max-w-2xl mx-auto leading-relaxed">
                  "{card.question}"
                </h3>

                {showAnswer && (
                  <div className="mt-4 bg-slate-950 border border-purple-900/50 rounded-xl p-4 text-xs text-slate-200 text-left leading-relaxed animate-fadeIn max-w-2xl mx-auto">
                    <div className="font-bold text-purple-300 mb-1 flex items-center gap-2">
                      <i className="fa-solid fa-star text-amber-300"></i>
                      <span>Recommended Model Answer:</span>
                    </div>
                    {card.sampleAnswer}
                  </div>
                )}
              </div>

              {/* Flashcard Controls */}
              <div className="mt-6 flex justify-between items-center max-w-xl mx-auto w-full pt-4 border-t border-slate-800">
                <button
                  onClick={() => {
                    setShowAnswer(false);
                    setCardIndex(prev => Math.max(0, prev - 1));
                  }}
                  disabled={cardIndex === 0}
                  className="bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-slate-200 text-xs font-semibold px-4 py-2 rounded-xl transition-all"
                >
                  Previous
                </button>

                <button
                  onClick={() => setShowAnswer(!showAnswer)}
                  className="bg-tp-800 hover:bg-tp-700 text-purple-200 text-xs font-semibold px-5 py-2 rounded-xl border border-purple-600/40 transition-all"
                >
                  {showAnswer ? "Hide Answer" : "Reveal Model Answer"}
                </button>

                <button
                  onClick={() => {
                    setShowAnswer(false);
                    setCardIndex(prev => Math.min(INTERVIEW_FLASHCARDS.length - 1, prev + 1));
                  }}
                  disabled={cardIndex === INTERVIEW_FLASHCARDS.length - 1}
                  className="bg-tp-600 hover:bg-tp-500 disabled:opacity-30 text-white text-xs font-semibold px-4 py-2 rounded-xl transition-all shadow-lg shadow-tp-600/20"
                >
                  Next
                </button>
              </div>

            </div>
          </div>

          {/* Section 2: Interactive STAR Method Builder */}
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
            <div className="mb-6">
              <h3 className="text-lg font-bold text-white flex items-center gap-2">
                <i className="fa-solid fa-wand-magic-sparkles text-tp-accent"></i>
                <span>Interactive STAR Method Story Generator</span>
              </h3>
              <p className="text-xs text-slate-400 mt-1">
                Build behavioral interview answers using the <strong>S</strong>ituation, <strong>T</strong>ask, <strong>A</strong>ction, <strong>R</strong>esult framework.
              </p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label className="block text-xs font-semibold text-purple-300 mb-1">Situation (Context / Background)</label>
                <textarea
                  value={starData.situation}
                  onChange={(e) => setStarData({...starData, situation: e.target.value})}
                  placeholder="e.g. A customer was extremely angry because their high-priority package was lost during holiday rush."
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-tp-500 h-20 resize-none"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-indigo-300 mb-1">Task (Your Objective / Responsibility)</label>
                <textarea
                  value={starData.task}
                  onChange={(e) => setStarData({...starData, task: e.target.value})}
                  placeholder="e.g. De-escalate the tension, locate the package, and offer an immediate resolution without transfer."
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-tp-500 h-20 resize-none"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-teal-300 mb-1">Action (Specific Steps YOU Took)</label>
                <textarea
                  value={starData.action}
                  onChange={(e) => setStarData({...starData, action: e.target.value})}
                  placeholder="e.g. Validated their concern empathetically, contacted logistics directly via live chat, and issued priority replacement delivery."
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-tp-500 h-20 resize-none"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-amber-300 mb-1">Result (Positive Outcome & Metrics)</label>
                <textarea
                  value={starData.result}
                  onChange={(e) => setStarData({...starData, result: e.target.value})}
                  placeholder="e.g. The customer received the item the next morning and rated the chat session 5/5 stars CSAT."
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-tp-500 h-20 resize-none"
                />
              </div>
            </div>

            <button
              onClick={generateStarResponse}
              className="mt-4 bg-gradient-to-r from-tp-600 to-indigo-600 hover:from-tp-500 hover:to-indigo-500 text-white font-semibold text-xs px-5 py-2.5 rounded-xl transition-all shadow-lg shadow-tp-600/30 flex items-center gap-2"
            >
              <i className="fa-solid fa-gears"></i>
              <span>Compile STAR Answer</span>
            </button>

            {/* Generated STAR Output Box */}
            {starOutput && (
              <div className="mt-4 bg-slate-950 border border-purple-800/60 rounded-xl p-4 relative">
                <div className="flex justify-between items-center mb-2">
                  <span className="text-xs font-bold text-purple-300">Your Polished STAR Response:</span>
                  <button
                    onClick={() => copyToClipboard(starOutput)}
                    className="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1 rounded-lg border border-slate-700 transition-colors"
                  >
                    <i className="fa-solid fa-copy mr-1"></i> Copy Response
                  </button>
                </div>
                <p className="text-xs text-slate-200 leading-relaxed italic">{starOutput}</p>
              </div>
            )}

          </div>

        </div>
      );
    }

    // =========================================================================
    // MODULE 6: PRINTABLE MASTER DOC VIEW (Optimized for PDF Export)
    // =========================================================================
    function ModulePrintDoc({ triggerPdfPrint }) {
      return (
        <div className="space-y-6">
          
          {/* Header Action Banner */}
          <div className="no-print bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
              <h2 className="text-xl font-bold text-white flex items-center gap-2">
                <i className="fa-solid fa-file-pdf text-rose-400"></i>
                <span>PDF Master Reviewer Cheatsheet</span>
              </h2>
              <p className="text-xs text-slate-400 mt-1">
                This document view formats all recruitment materials into a clean printable layout for offline PDF saving.
              </p>
            </div>
            <button
              onClick={triggerPdfPrint}
              className="bg-gradient-to-r from-rose-600 to-tp-600 hover:from-rose-500 hover:to-tp-500 text-white font-semibold text-xs px-5 py-2.5 rounded-xl shadow-lg shadow-rose-600/20 transition-all flex items-center gap-2"
            >
              <i className="fa-solid fa-print"></i>
              <span>Print / Download PDF</span>
            </button>
          </div>

          {/* Master Printable Sheet Card */}
          <div className="card-print bg-slate-900 border border-slate-800 rounded-2xl p-8 space-y-8">
            
            {/* Title Header */}
            <div className="text-center pb-6 border-b border-slate-800">
              <h1 className="text-2xl font-black text-white">TELEPERFORMANCE AOE ACCOUNT REVIEWER</h1>
              <p className="text-xs text-slate-400 mt-1">Non-Voice Customer Service & Back-Office Recruitment Guide</p>
            </div>

            {/* Section 1: Non-Voice Chat Etiquette & Phrasing */}
            <div>
              <h2 className="text-sm font-bold text-purple-400 uppercase tracking-wider mb-3">1. Non-Voice Chat Etiquette & Response Templates</h2>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                  <strong className="text-purple-300 block mb-1">Opening Greeting:</strong>
                  <p className="text-slate-300 italic">"Thank you for contacting Teleperformance Customer Support! My name is [Agent Name]. I'm happy to assist you today. May I please have your full name and order number?"</p>
                </div>

                <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                  <strong className="text-indigo-300 block mb-1">De-escalating Angry Customers:</strong>
                  <p className="text-slate-300 italic">"I completely understand how disappointing this delivery delay is. I am truly sorry for the inconvenience, and I am taking immediate action to get this resolved for you."</p>
                </div>

                <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                  <strong className="text-teal-300 block mb-1">Requesting a Hold:</strong>
                  <p className="text-slate-300 italic">"To get the most accurate update, may I place you on a brief 2-minute hold while I verify your account details with our logistics team?"</p>
                </div>

                <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                  <strong className="text-amber-300 block mb-1">Polite Closing:</strong>
                  <p className="text-slate-300 italic">"I'm glad I could assist with updating your shipping address today. Is there anything else I can help you with? Thank you for chatting with us, and have a wonderful day!"</p>
                </div>
              </div>
            </div>

            {/* Section 2: Core Grammar Rules */}
            <div>
              <h2 className="text-sm font-bold text-purple-400 uppercase tracking-wider mb-3">2. Essential BPO Written Grammar Cheatsheet</h2>
              <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2 text-xs">
                <div><strong>Subject-Verb Agreement:</strong> The verb agrees with the subject closer to 'or' / 'nor' (e.g., <em>Neither the agent nor the supervisors <u>were</u> notified.</em>)</div>
                <div><strong>Credited To:</strong> Always use <em>credited to your account</em> (NOT <em>credited in your account</em>).</div>
                <div><strong>Ensure vs. Assure:</strong> Use <em>Assure</em> for people (<em>"I assure you..."</em>) and <em>Ensure</em> for actions (<em>"I will ensure the order ships today."</em>).</div>
                <div><strong>Present Continuous in Live Chat:</strong> Use active continuous tense (<em>"I am checking your details right now..."</em>).</div>
              </div>
            </div>

            {/* Section 3: Core KPIs */}
            <div>
              <h2 className="text-sm font-bold text-purple-400 uppercase tracking-wider mb-3">3. Teleperformance Metric Benchmarks</h2>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-center text-xs">
                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                  <div className="font-bold text-purple-300">Typing Speed</div>
                  <div className="text-slate-200 mt-1">35-45+ WPM</div>
                </div>
                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                  <div className="font-bold text-indigo-300">Accuracy</div>
                  <div className="text-slate-200 mt-1">95%+ Minimum</div>
                </div>
                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                  <div className="font-bold text-teal-300">AHT (Handle Time)</div>
                  <div className="text-slate-200 mt-1">3 - 5 Minutes</div>
                </div>
                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                  <div className="font-bold text-amber-300">CSAT Score</div>
                  <div className="text-slate-200 mt-1">85% - 90%+ Target</div>
                </div>
              </div>
            </div>

          </div>

        </div>
      );
    }

    // Render App into DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
